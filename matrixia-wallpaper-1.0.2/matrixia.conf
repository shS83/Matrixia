[Matrixia]

# normal, party, grayscale, cycle, random or double
mode=normal

# Used by normal mode
color=#0000ff
background=#000000

font=VL Gothic
font_size=21
trail=35
frame_interval=25
spawn_per_frame=1
max_streams=256
cycle_frames=8
reverse=off

# Compatibility switches. Turning one on overrides mode above.
partymode=off
grayscale=off
cyclist=off
random=off
doubletrouble=off
